<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Redirecting...</title>
<link rel="canonical" href="https://streakrise.com/">
</head>
<body style="margin:0;width:100%;height:100%;background:#121212;color:white;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;">
  Redirecting to <a href="https://streakrise.com/" style="color:white;">StreakRise</a>...
  <script>
    // Preserve all URL parameters (UTM params, ref, etc.) when redirecting
    const currentParams = new URLSearchParams(window.location.search);
    const targetUrl = new URL('https://streakrise.com/');

    // Copy all search parameters to the target URL
    currentParams.forEach((value, key) => {
      targetUrl.searchParams.set(key, value);
    });

    // Add redirect source tracking
    targetUrl.searchParams.set('redirect_from', 'streakup_pro');

    window.location.replace(targetUrl.toString());
  </script>
</body>
</html>
